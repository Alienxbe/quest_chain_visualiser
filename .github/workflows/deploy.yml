name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # daily: pick up Questie database updates
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run import-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Map data derived from game files (keyed by file id, so it never goes stale): keeping it
      # between runs avoids re-downloading ~1 GB of terrain files from wago.tools every day.
      - uses: actions/cache@v4
        with:
          path: .cache/maps/derived
          key: map-textures-${{ github.run_id }}
          restore-keys: map-textures-
      - run: npm run import-maps
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
